name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version v$version"
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate and build web app
        run: npm run build

      - name: Build Windows installer
        shell: pwsh
        run: npx --yes electron-builder@latest --win nsis --x64 --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'REduQuest-Setup-*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'REduQuest Setup.exe was not produced' }
          if ($installer.Length -lt 50MB) { throw "Installer looks too small: $([math]::Round($installer.Length / 1MB, 1)) MB" }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: REduQuest-Windows-Setup
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## REduQuest $env:GITHUB_REF_NAME

          Windows x64 installer for REduQuest.

          Existing installed copies will detect this release, download the installer
          from GitHub and apply it after the application closes.
          "@
          gh release create "$env:GITHUB_REF_NAME" "$env:INSTALLER_PATH" --verify-tag --title "REduQuest $env:GITHUB_REF_NAME" --notes $notes
